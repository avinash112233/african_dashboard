services:

  # ── Backend: Node.js Express + Python MERRA2 worker ──────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aqf_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MERRA2_PARQUET_DIR=/data/merra2
      - MERRA2_API_PORT=3001
      - WASHU_PARQUET_DIR=/data/washu-parquet
      - WASHU_CACHE_DIR=/data/washu-cache
      - OPENAQ_ARCHIVE_CACHE_DIR=/data/openaq-cache
    volumes:
      # Your local Parquet folder, mounted read-only into the container
      - /home/ubuntu/AFRICAN_PM25_DATA/DATA_FOR_VISHAL:/data/merra2:ro
      # WashU station parquet (monthly + annual). Host path → container /data/washu-parquet
      # Place AAQE_WASHU_PM25_V6GL0204_MONTHLY*.parquet and *_ANNUAL.parquet on the host.
      - /home/ubuntu/AFRICAN_PM25_DATA/WASHU_STATIONS:/data/washu-parquet:ro
      # Persist WashU NetCDF + OpenAQ archive caches across container restarts
      - washu_cache:/data/washu-cache
      - openaq_cache:/data/openaq-cache
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/merra2/latest-date', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend: React app served by Nginx ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_FIRMS_MAP_KEY: ${VITE_FIRMS_MAP_KEY}
        VITE_AAQE_USE_DIRECT_NASA: "false"
        VITE_ENABLE_DASHBOARD_V2: ${VITE_ENABLE_DASHBOARD_V2:-false}
        VITE_DASHBOARD_V2_ONLY: ${VITE_DASHBOARD_V2_ONLY:-false}
    container_name: aqf_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  washu_cache:
  openaq_cache: