version: '3.9'

services:

  # ── Backend: Node.js Express + Python MERRA2 worker ──────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aqf_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MERRA2_PARQUET_DIR=/data/merra2
      - MERRA2_API_PORT=3001
      # Optional: NASA Earthdata credentials for future MERRA2 data downloads
      # - EARTHDATA_USERNAME=your_username
      # - EARTHDATA_PASSWORD=your_password
    volumes:
      # Mount your local MERRA2 Parquet folder into the container.
      # Change the LEFT side to your actual Parquet files path on the host.
      - ${MERRA2_HOST_DIR:-./data/merra2}:/data/merra2:ro
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/merra2/latest-date', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend: React app served by Nginx ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NASA FIRMS Map Key — required for fire hotspot layer
        VITE_FIRMS_MAP_KEY: ${VITE_FIRMS_MAP_KEY}
        VITE_AAQE_USE_DIRECT_NASA: "false"
    container_name: aqf_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
